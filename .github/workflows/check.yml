# The same command as local development, in the same pinned toolchain. This is
# deliberately not a second recipe with node and playwright installed by hand:
# a CI that defines correct differently from the local shell is a CI that drifts.
#
# The flake is what makes that reproducible. flake.lock pins nixpkgs to one
# commit, so CI cannot pick up a new node or Playwright and silently repaint the
# golden screenshots differently from every other machine.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0, not the default 1: phase 6 checks which commit last
      # changed index.html and that the pinned one holds these bytes, and a
      # shallow clone does not contain that commit. The default silently made
      # the check report "not a commit in this repository" - true, and the
      # wrong conclusion. The repository is a handful of commits and a few
      # hundred KiB, so fetching it whole costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a release that exists. `@V29` looked plausible and resolved to
      # nothing at all: the upstream tags are lowercase and three-part, so the
      # job died in "Set up job" after 7 seconds, before a single test ran.
      #   https://github.com/cachix/install-nix-action/releases/tag/v31.11.3
      - uses: cachix/install-nix-action@v31.11.3
        with:
          # No nix_path: the flake is the input, and its lock file decides what
          # nixpkgs means. Pointing NIX_PATH somewhere else would let the
          # workflow resolve a different nixpkgs from the one being tested.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Checks out nothing extra and installs nothing outside the lock: build,
      # syntax, unit and interaction tests, engine coverage, and 18 golden
      # screenshots. Exits non-zero if any phase cannot run, so a missing browser
      # or a missing baseline is a red build rather than a green one that checked
      # nothing.
      # Both engines are named explicitly rather than left to defaults, and both
      # are required: a phase that silently tested nothing must stay a red build.
      #
      # The two phases deliberately use different engines. Goldens are captured
      # and compared inside one process, so the baselines can only ever be
      # painted by the engine that checks them, and the committed baselines are
      # Firefox. Chromium is exercised for behaviour instead, which is the part
      # that transfers across engines.
      - name: Run the acceptance checklist
        run: nix develop --command ./check.sh --engine firefox --engines firefox,chromium

      # On failure, the frames CI saw are the difference between "the layout
      # moved" and "the font changed", so keep them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-actual
          path: .tmp/golden-actual/
          if-no-files-found: ignore
