# The same command as local development: nix-shell shell.nix --run ./check.sh.
# This is deliberately not a second recipe with node and playwright installed by
# hand - a CI that defines correct differently from the local shell is a CI that
# drifts.
#
# NOT ENABLED: this project has no designated remote repository yet, so pushing
# it is an operator action. Once a remote exists, this workflow runs on pushes and
# pull requests to main.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      # Build, syntax, 51 tests, and 18 golden screenshots. Exits non-zero if any
      # phase cannot run, so a missing browser or a missing baseline is a red
      # build rather than a green one that checked nothing.
      - name: Run the acceptance checklist
        run: nix-shell shell.nix --run ./check.sh

      # On failure the frames CI saw are the difference between "the layout moved"
      # and "the font changed", so keep them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-actual
          path: .tmp/golden-actual/
          if-no-files-found: ignore
